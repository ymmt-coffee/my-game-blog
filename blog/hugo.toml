baseURL = "https://ymmt-coffee.github.io/my-game-blog/"
locale = "ja-JP"
defaultContentLanguage = "ja"
title = "FRAMING"
theme = "PaperMod"
buildFuture = false
enableRobotsTXT = true
publishDir = "../var/public"
resourceDir = "../var/resources"

[frontmatter]
  date = ["date", "publishDate"]

[params]
  description = "PCゲームを中心に、プレイ途中の所感、新作・セール情報、ゲーム体験を綴る個人ブログです。"
  author = "やまもと"
  defaultTheme = "light"
  disableThemeToggle = true
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  disableSpecial1stPost = true

  [params.analytics]
    provider = ""

    [params.analytics.umami]
      scriptUrl = "https://cloud.umami.is/script.js"
      websiteId = ""
      excludeSelf = true

    [params.analytics.google]
      measurementId = ""

    [params.analytics.plausible]
      domain = ""

  [params.schema]
    publisherType = "Person"

  [params.assets]
    favicon = "favicon.svg"
    favicon16x16 = "favicon.svg"
    favicon32x32 = "favicon.svg"
    apple_touch_icon = "favicon.svg"
    safari_pinned_tab = "favicon.svg"

[[menu.main]]
  name = "プレイログ"
  url = "/article_type/play_note/"
  weight = 10

[[menu.main]]
  name = "新作・セール"
  url = "/article_type/weekly_picks/"
  weight = 20

[[menu.main]]
  name = "月刊コラム"
  url = "/article_type/monthly_essay/"
  weight = 30

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 40

[[menu.main]]
  name = "検索"
  url = "/search/"
  weight = 50

[taxonomies]
  category = "article_type"

[outputs]
  home = ["HTML", "RSS", "JSON"]
