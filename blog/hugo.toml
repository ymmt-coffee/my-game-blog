baseURL = "https://ymmt-coffee.github.io/my-game-blog/"
locale = "ja-JP"
defaultContentLanguage = "ja"
title = "game logs"
theme = "PaperMod"
buildFuture = false
enableRobotsTXT = true
publishDir = "../var/public"
resourceDir = "../var/resources"

[frontmatter]
  date = ["date", "publishDate"]

[params]
  description = "PCゲームを中心に、プレイ途中の所感、新作・セール情報、ゲーム体験を綴る個人ブログです。"
  author = "やまもと"
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  disableSpecial1stPost = true

  [params.analytics]
    provider = ""

    [params.analytics.umami]
      scriptUrl = "https://cloud.umami.is/script.js"
      websiteId = ""
      excludeSelf = true

    [params.analytics.google]
      measurementId = ""

    [params.analytics.plausible]
      domain = ""

  [params.schema]
    publisherType = "Person"

  [params.assets]
    favicon = "favicon.svg"
    favicon16x16 = "favicon.svg"
    favicon32x32 = "favicon.svg"
    apple_touch_icon = "favicon.svg"
    safari_pinned_tab = "favicon.svg"

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  name = "プライバシー"
  url = "/privacy/"
  weight = 20

[[menu.main]]
  name = "広告・提供方針"
  url = "/editorial-policy/"
  weight = 30

[[menu.main]]
  name = "レビューキー"
  url = "/review-key-policy/"
  weight = 40
