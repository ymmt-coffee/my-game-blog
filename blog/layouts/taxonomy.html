{{- define "main" }}
<script type="application/ld+json">{{ dict "@context" "https://schema.org" "@type" "CollectionPage" "name" .Title "url" .Permalink | jsonify | safeJS }}</script>
<header class="page-header"><h1>{{ .Title }}</h1></header>
<div class="media-latest-grid">
  {{- $type := .Type }}
  {{- range .Data.Terms.Alphabetical }}
    {{- $name := .Name }}
    {{- $count := .Count }}
    {{- with site.GetPage (printf "/%s/%s" $type $name) }}
    <a class="media-archive-card media-term-card" href="{{ .RelPermalink }}">
      <div class="media-archive-copy"><h2>{{ .LinkTitle }}</h2><p>{{ $count }}件の記事</p></div>
    </a>
    {{- end }}
  {{- end }}
</div>
{{- end }}
