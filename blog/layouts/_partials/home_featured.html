<article class="home-featured">
  {{ partial "media_visual.html" (dict "page" . "class" "home-featured-visual") }}
  <div class="home-featured-copy">
    <span class="media-eyebrow">{{ partial "article_type_label.html" . }}</span>
    <h1 class="home-featured-title">{{ .Title }}</h1>
    {{- if ne (.Param "hideSummary") true }}
    <div class="home-featured-content">{{ partial "post_summary.html" . }}</div>
    {{- end }}
    <div class="home-featured-meta">{{ partial "date_and_elapsed.html" . }}</div>
  </div>
  <a class="entry-link" aria-label="post link to {{ .Title | plainify }}" href="{{ .Permalink }}"></a>
</article>
