<header class="media-header">
  <div class="media-header-inner">
    <a class="media-brand" href="{{ "" | absLangURL }}" aria-label="ホーム">
      <strong>{{ site.Title }}</strong>
      <span>INDEPENDENT GAME JOURNAL</span>
    </a>
    <nav class="media-menu" aria-label="メインメニュー">
      {{- range site.Menus.main }}
      {{- if or (site.GetPage .URL) (in (slice "About" "検索") .Name) }}
      <a href="{{ .URL | absLangURL }}">{{ .Name }}</a>
      {{- end }}
      {{- end }}
    </nav>
  </div>
</header>
