  primary: X
  secondary: Bluesky
  official_account_tone: factual_and_calm
  personal_account_is_publicly_the_author: true
  automatic_replies: false
  author_handles_replies: true
  ai_may_summarize_articles: true
  ai_must_not_invent_first_person_experience: true
  monthly_essay_posts_use_author_excerpt: true
  repost_windows:
    - immediately
    - next_day
    - one_week
    - one_month
    - relevant_sale
    - major_update_or_full_release
  routine_reposts_max_article_age_days: 31
  publish_only_after_site_deploy_success: true

discord:
  category: "編集室"
  mode: incoming_webhooks
  channels:
    assignments: "今週の指示"
    publish: "公開通知"
    social: "sns予定"
    monthly_report: "アクセス月報"
    errors: "エラー通知"
    attention: "要確認"
  secrets_must_not_be_stored_here: true
  secret_names:
    publish: DISCORD_WEBHOOK_PUBLISH
    errors: DISCORD_WEBHOOK_ERROR
    attention: DISCORD_WEBHOOK_ATTENTION
  implementation_status: completed
  notification_rules:
    publish_success: "push後のHEAD commitがpublish: <安全なslug>で、push全体の変更範囲が対象記事だけ、build・deploy・Pages・記事URL確認が成功"
    normal_push_success: no_notification
    schedule_success: no_notification
    workflow_dispatch_success: no_notification
    technical_failure_all_triggers: errors
    unsafe_publish_identification_after_successful_deploy: attention
    missing_or_stale_review_report: deferred_transfer_design
  payload_allowlist:
    - notification_type
    - article_slug_or_failure_stage
    - public_url
    - commit_short_sha
    - trigger
    - actions_run_url
  payload_excludes:
    - webhook_url
    - article_body
    - review_report_body
    - secrets
    - full_logs
  allowed_mentions: disabled
  retry:
    statuses: [429, "500-599"]
    maximum_total_attempts: 3
    other_statuses: no_retry
    uncertain_connection_result: no_retry_to_reduce_duplicates
  notification_failure_marks_actions_failed: true
  notification_failure_rolls_back_published_content: false
  workflow_rerun_may_duplicate: true
  duplicate_identifiers: [commit_short_sha, actions_run_url]
  live_test_messages_sent: 3

