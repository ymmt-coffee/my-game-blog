version: 4
updated_at: "2026-08-11"

direction:
  primary_interface: local_admin_web_app
  admin_network_scope: localhost_only
  first_goal: article_management_and_publishing
  public_target: hugo_blog_only
  obsidian_role: retired_for_current_articles
  discord_enabled: false

current:
  phase: scheduling_and_calendar
  phase_status: completed
  retained:
    - hugo_blog
    - article_page_bundles
    - proofreading
    - local_preview
    - publish_validation
    - article_scoped_publish
    - github_pages_deploy
    - encrypted_daily_and_monthly_backup
  deferred_to_old:
    - discord_notifications
    - weekly_ai_research
    - weekly_picks_generation_pipeline
    - former_phase_6_editor_in_chief_plan

article_management:
  body_format: markdown
  image_storage: page_bundle_images
  state_storage: sqlite_for_metadata_only
  states: [draft, review_pending, ready, scheduled, published, archived]
  operations: [save, search, preview, prepublish_check, publish, schedule, delete_to_trash, restore]
  require_confirmation_before_publish: true
  publish_confirmation_requires_slug_input: false
  recoverable_archive: true
  slug_format: YYYYMMDD-NNN
  slug_sequence_scope: daily
  article_search_fields: [title, slug]
  delete_behavior: recoverable_logical_trash
  article_list_tabs: [draft, published]
  trash_restore_location: settings_history
  legacy_dry_run_link_visible: false
  editor_heading_uses_saved_title: true
  image_thumbnail_enabled: true
  image_markdown_copy_enabled: true
  image_markdown_format: "![alt](images/filename)"
  header_image_setting_enabled: true
  header_image_front_matter: cover.image
  body_image_auto_thumbnail: false
  published_edit_behavior: working_draft_keeps_live_version
  published_update_draft_label: 公開記事の更新下書き
  draft_editor_archive_section_visible: false
  body_actions_position: top_right
  play_note_completion_field: game_completed
  completed_play_note_hides_incomplete_notice: true
  uncommitted_autosave_blocks_preview_and_prepublish: true
  precommit_publish_failure_returns_to_update_draft: true
  published_tab_includes_articles_with_live_version: true
  zero_diff_publish_message: manual_save_required
  public_copy_reconciliation: compare_content_and_images
  public_sync_labels: [published, local_update, missing_public_copy]
  public_only_import: explicit_non_destructive_copy
  public_or_canonical_auto_delete: false
  published_delete_behavior: confirmed_unpublish_then_logical_trash
  matching_restore_behavior: reconcile_as_published_without_republish
  schedule_confirmation_required: true
  schedule_confirmation_authorizes_due_publish: true
  scheduled_snapshot_bound_to_file_hash: true
  scheduled_publish_while_admin_running: true
  overdue_schedule_runs_on_next_admin_start: true
  schedule_failure_behavior: return_to_ready_with_safe_message
  calendar_views: [month, week]
  calendar_sources_enabled: [article_schedule, article_publish]
  calendar_sources_deferred: [social_post, release_date, sale_end]

phase_a_design:
  document: docs/phase-a-data-migration-design.md
  approved_at: "2026-08-09"
  canonical_content: content/articles
  admin_database: var/admin/admin.sqlite3
  backend: fastapi
  frontend: server_rendered_html_css_javascript
  autosave_idle_seconds: 2
  autosave_max_seconds: 30
  history_generations: 30
  history_days: 90
  archive_behavior: logical_without_file_move
  legacy_source_minimum_retention_days: 30
  legacy_source_requires_monthly_backup_after_migration: true
  legacy_source_deletion_requires_separate_approval: true
  legacy_source_count: 0
  legacy_test_articles_recycled_at: "2026-08-09"
  legacy_test_article_deletion_authorized: true
  phase_b_implementation_started: true
  phase_b_implementation_completed: true
  migration_authorized: false

admin_app:
  implementation: fastapi
  host: 127.0.0.1
  port: 8765
  public_network_access: false
  single_instance: true
  state_database: var/admin/admin.sqlite3
  article_operations_enabled: true
  publish_operations_enabled: true
  schema_version: 4
  startup_script: admin/open-admin.ps1
  manual_server_script: admin/start-admin.ps1
  desktop_shortcut: ゲームブログ管理.lnk
  desktop_shortcut_auto_restarts_outdated_version: true
  launcher_window_visible: false
  ui_font: Noto Sans JP
  ui_density: compact
  ui_shape: low_radius_linear
  personal_tool_reduces_explanatory_text: true

phase_c:
  completed_at: "2026-08-09"
  canonical_content_ready: true
  autosave_enabled: true
  history_enabled: true
  optimistic_locking_enabled: true
  external_change_requires_acceptance: true
  image_overwrite_enabled: false
  archive_is_logical: true
  legacy_migration_mode: dry_run_only
  legacy_copy_or_move_authorized: false

phase_d:
  completed_at: "2026-08-09"
  templates_enabled: [play_note, weekly_picks, monthly_essay]
  category_guidance_enabled: true
  required_field_inspection_enabled: true
  draft_save_allowed_with_missing_fields: true
  category_change_overwrites_body: false
  unknown_front_matter_preserved: true
  blank_body_templates: [play_note, monthly_essay]
  retained_body_templates: [weekly_picks]

phase_e:
  completed_at: "2026-08-09"
  ai_review_changes_body: false
  ai_review_enabled: false
  ai_review_required_for_publish: false
  review_storage: var/admin/reviews
  preview_uses_temporary_content: true
  prepublish_checks_required: true
  approval_expires_minutes: 15
  approval_bound_to_article_hash: true
  publish_paths_are_article_scoped: true
  pages_and_public_url_confirmation: true
  real_publish_performed_during_implementation: false

phase_f:
  completed_at: "2026-08-11"
  public_design: minimal_linear_game_media
  color_palette: grayscale_black
  public_ui_density: compact
  article_outer_width_matches_home: true
  article_reading_width_px: 776
  article_header_width_matches_reading_column: true
  article_header_max_height_px: 300
  latest_layout: vertical_list
  empty_ad_space_reserved: false
  blog_title: FRAMING
  latest_featured_count: 1
  home_order: date_desc_then_auto_slug_desc
  navigation: [play_note, weekly_picks, monthly_essay, about, search]
  header_image_source: explicit_cover_image_only
  body_image_auto_thumbnail: false
  category_placeholder_when_unset: true
  responsive_mobile_verified: true
  public_deploy_performed_during_implementation: false

article_types:
  play_note:
    enabled: true
    requires: [title, date, lastmod, draft, description, images, article_type, play_time, author]
  weekly_picks:
    enabled: true
    requires: [title, date, lastmod, draft, description, images, article_type, author]
  monthly_essay:
    enabled: true
    requires: [title, date, lastmod, draft, description, images, article_type, author]

roadmap_order:
  - data_and_migration_design
  - admin_shell
  - article_management
  - article_templates
  - proofreading_preview_publish
  - blog_design
  - scheduling
  - calendar
  - analytics
  - social_draft_and_approval
  - social_automation
  - shared_game_information
  - ai_editorial
  - release_and_sale

safety:
  ai_may_modify_article_body: false
  review_report_published: false
  external_actions_require_approval: true
  secrets_in_repository: false
  tests_use_real_external_services: false
  backup_remains_enabled: true
  backup_failure_notification: local_status_only

maintenance:
  refactored_at: "2026-08-11"
  behavior_preserving: true
  admin_article_input_normalized: true
  article_type_source_of_truth: template_definitions
  public_article_type_label_partial: article_type_name.html
  public_home_order_partial: home_ordered_pages.html
  public_latest_partial: home_latest.html
