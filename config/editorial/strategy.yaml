article_management:
  body_format: markdown
  image_storage: page_bundle_images
  state_storage: sqlite_for_metadata_only
  states: [draft, review_pending, ready, scheduled, published, archived]
  operations: [save, search, preview, prepublish_check, publish, schedule, delete_to_trash, restore]
  require_confirmation_before_publish: true
  publish_confirmation_requires_slug_input: false
  recoverable_archive: true
  slug_format: YYYYMMDD-NNN
  slug_sequence_scope: daily
  article_search_fields: [title, slug]
  delete_behavior: recoverable_logical_trash
  article_list_tabs: [draft, published]
  trash_restore_location: settings_history
  legacy_dry_run_link_visible: false
  editor_heading_uses_saved_title: true
  image_thumbnail_enabled: true
  image_markdown_copy_enabled: true
  image_markdown_format: "![alt](images/filename)"
  header_image_setting_enabled: true
  header_image_front_matter: cover.image
  body_image_auto_thumbnail: false
  published_edit_behavior: working_draft_keeps_live_version
  published_update_draft_label: 公開記事の更新下書き
  draft_editor_archive_section_visible: false
  body_actions_position: top_right
  play_note_completion_field: game_completed
  completed_play_note_hides_incomplete_notice: true
  uncommitted_autosave_blocks_preview_and_prepublish: true
  precommit_publish_failure_returns_to_update_draft: true
  published_tab_includes_articles_with_live_version: true
  zero_diff_publish_message: manual_save_required
  public_copy_reconciliation: compare_content_and_images
  public_sync_labels: [published, local_update, missing_public_copy]
  public_only_import: explicit_non_destructive_copy
  public_or_canonical_auto_delete: false
  published_delete_behavior: confirmed_unpublish_then_logical_trash
  matching_restore_behavior: reconcile_as_published_without_republish
  schedule_confirmation_required: true
  schedule_confirmation_authorizes_due_publish: true
  scheduled_snapshot_bound_to_file_hash: true
  scheduled_publish_while_admin_running: true
  overdue_schedule_runs_on_next_admin_start: true
  schedule_failure_behavior: return_to_ready_with_safe_message
  calendar_views: [month, week]
  calendar_sources_enabled: [article_schedule, article_publish, analytics_review]
  calendar_sources_deferred: [social_post, release_date, sale_end]

