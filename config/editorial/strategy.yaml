version: 2
updated_at: "2026-08-09"

direction:
  primary_interface: local_admin_web_app
  admin_network_scope: localhost_only
  first_goal: article_management_and_publishing
  public_target: hugo_blog_only
  obsidian_role: interim_article_editor_until_admin_migration
  discord_enabled: false

current:
  phase: article_management
  phase_status: completed
  retained:
    - hugo_blog
    - article_page_bundles
    - proofreading
    - local_preview
    - publish_validation
    - article_scoped_publish
    - github_pages_deploy
    - encrypted_daily_and_monthly_backup
  deferred_to_old:
    - discord_notifications
    - weekly_ai_research
    - weekly_picks_generation_pipeline
    - former_phase_6_editor_in_chief_plan

article_management:
  body_format: markdown
  image_storage: page_bundle_images
  state_storage: sqlite_for_metadata_only
  states: [draft, review_pending, ready, scheduled, published, archived]
  operations: [save, proofread, preview, prepublish_check, publish, schedule, archive]
  require_confirmation_before_publish: true
  recoverable_archive: true

phase_a_design:
  document: docs/phase-a-data-migration-design.md
  approved_at: "2026-08-09"
  canonical_content: content/articles
  admin_database: var/admin/admin.sqlite3
  backend: fastapi
  frontend: server_rendered_html_css_javascript
  autosave_idle_seconds: 2
  autosave_max_seconds: 30
  history_generations: 30
  history_days: 90
  archive_behavior: logical_without_file_move
  legacy_source_minimum_retention_days: 30
  legacy_source_requires_monthly_backup_after_migration: true
  legacy_source_deletion_requires_separate_approval: true
  phase_b_implementation_started: true
  phase_b_implementation_completed: true
  migration_authorized: false

admin_app:
  implementation: fastapi
  host: 127.0.0.1
  port: 8765
  public_network_access: false
  single_instance: true
  state_database: var/admin/admin.sqlite3
  article_operations_enabled: true
  publish_operations_enabled: false
  schema_version: 2
  startup_script: admin/open-admin.ps1
  manual_server_script: admin/start-admin.ps1
  desktop_shortcut: ゲームブログ管理.lnk

phase_c:
  completed_at: "2026-08-09"
  canonical_content_ready: true
  autosave_enabled: true
  history_enabled: true
  optimistic_locking_enabled: true
  external_change_requires_acceptance: true
  image_overwrite_enabled: false
  archive_is_logical: true
  legacy_migration_mode: dry_run_only
  legacy_copy_or_move_authorized: false

article_types:
  play_note:
    enabled: true
    requires: [title, date, lastmod, draft, description, images, article_type, play_time, author]
  weekly_picks:
    enabled: true
    requires: [title, date, lastmod, draft, description, images, article_type, author]
  monthly_essay:
    enabled: true
    requires: [title, date, lastmod, draft, description, images, article_type, author]

roadmap_order:
  - data_and_migration_design
  - admin_shell
  - article_management
  - article_templates
  - proofreading_preview_publish
  - blog_design
  - scheduling
  - calendar
  - analytics
  - social_draft_and_approval
  - social_automation
  - shared_game_information
  - ai_editorial
  - release_and_sale

safety:
  ai_may_modify_article_body: false
  review_report_published: false
  external_actions_require_approval: true
  secrets_in_repository: false
  tests_use_real_external_services: false
  backup_remains_enabled: true
  backup_failure_notification: local_status_only
